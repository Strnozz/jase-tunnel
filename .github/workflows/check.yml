name: Check Jase Tunnel

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build independent web SDK fixture
        run: npm ci --ignore-scripts --prefix packages/sdk && npm --prefix packages/sdk run build
      - name: Check transport, model adapters and privacy boundaries
        env:
          JASE_SDK_INTEGRATION: 'true'
        run: go test -race ./...
      - name: Prepare Linux desktop checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libayatana-appindicator3-1 xvfb dbus-x11
      - name: Exercise native Linux panel
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a env JASE_DESKTOP_SMOKE=1 G_DEBUG=fatal-criticals go test -run TestLinuxDesktopSmoke -count=1 ./...
