name: Check and package Jase Tunnel SDK
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SDK tag to publish or retry (for example sdk-v0.3.0); leave empty to run checks only
        required: false
        type: string
  push:
    branches: [main]
    tags: ['sdk-v*']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/sdk
      - run: npm --prefix packages/sdk test
  release:
    if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.release_tag != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts --prefix packages/sdk
      - name: Verify tag and create the npm package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('packages/sdk/package.json')).version; if(process.env.RELEASE_TAG!=='sdk-v'+version)throw new Error('SDK tag/version mismatch');"
          mkdir -p .deploy-check
          npm pack ./packages/sdk --pack-destination .deploy-check
          cd .deploy-check
          sha256sum jase-tunnel-*.tgz > SHA256SUMS
      - name: Publish an immutable SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p .deploy-check/published
            gh release download "$RELEASE_TAG" --pattern 'jase-tunnel-*.tgz' --pattern SHA256SUMS --dir .deploy-check/published
            cmp .deploy-check/jase-tunnel-*.tgz .deploy-check/published/jase-tunnel-*.tgz
            cmp .deploy-check/SHA256SUMS .deploy-check/published/SHA256SUMS
            echo 'Existing SDK release is identical; retrying npm publication without replacing its files.'
            exit 0
          fi
          export RELEASE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.deploy-check/sdk-notes.md', `Jase Tunnel SDK\n\nCommit: ${process.env.RELEASE_COMMIT}\nBuild: ${process.env.RELEASE_RUN}\n\nPacchetto npm: npx jase-tunnel init. Richiede Jase Tunnel 0.3.0 o successivo sul computer dei visitatori.\n`);
          JS
          gh release create "$RELEASE_TAG" .deploy-check/jase-tunnel-*.tgz .deploy-check/SHA256SUMS --verify-tag --target "$RELEASE_COMMIT" --draft --title "Jase Tunnel SDK $RELEASE_TAG" --notes-file .deploy-check/sdk-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
      - name: Install npm with support for staging new packages
        run: npm install --global npm@11.21.0 --ignore-scripts
      # Direct-capable tokens publish immediately. Stage-only tokens prepare the same
      # package for a maintainer's 2FA approval; no token permissions are broadened.
      - name: Publish to npm or prepare staged approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo 'NPM_TOKEN is not configured: npm publication cannot proceed.' >&2; exit 1; fi
          set +e
          npm publish .deploy-check/jase-tunnel-*.tgz --access public --provenance 2>&1 | tee .deploy-check/npm-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          if [ "$publish_status" -eq 0 ]; then exit 0; fi
          if ! node --input-type=module -e "import fs from 'node:fs'; process.exit(fs.readFileSync('.deploy-check/npm-publish.log','utf8').includes('(E_STAGE_REQUIRED)') ? 0 : 1);"; then exit "$publish_status"; fi
          npm stage publish .deploy-check/jase-tunnel-*.tgz --access public --tag latest --provenance
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          The npm token permits staging only. The verified SDK package is prepared for approval and is not public yet.

          Approve the staged version with 2FA in the npm website or with `npm stage approve <stage-id>`.
          MD
