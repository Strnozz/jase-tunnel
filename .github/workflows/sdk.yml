name: Check and package Jase Tunnel SDK
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['sdk-v*']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/sdk
      - run: npm --prefix packages/sdk test
  release:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix packages/sdk
      - name: Verify tag and create the npm package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('packages/sdk/package.json')).version; if(process.env.RELEASE_TAG!=='sdk-v'+version)throw new Error('SDK tag/version mismatch');"
          mkdir -p .deploy-check
          npm pack ./packages/sdk --pack-destination .deploy-check
          cd .deploy-check
          sha256sum jase-tunnel-sdk-*.tgz > SHA256SUMS
      - name: Publish an immutable SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; use a new version.' >&2; exit 1; fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.deploy-check/sdk-notes.md', `Jase Tunnel SDK\n\nCommit: ${process.env.RELEASE_COMMIT}\nBuild: ${process.env.RELEASE_RUN}\n\nPacchetto npm installabile tramite npx. Richiede Jase Tunnel 0.2.0 o successivo.\n`);
          JS
          gh release create "$RELEASE_TAG" .deploy-check/jase-tunnel-sdk-*.tgz .deploy-check/SHA256SUMS --verify-tag --target "$RELEASE_COMMIT" --draft --title "Jase Tunnel SDK $RELEASE_TAG" --notes-file .deploy-check/sdk-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
